<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Architectural Walkthrough - Sloping Bedroom Ceiling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        @media (prefers-color-scheme: dark) {
            .glass-panel {
                background: rgba(15, 23, 42, 0.85);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100">

    <div id="ui-overlay" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-6 z-10">
        <!-- Top Bar -->
        <div class="flex justify-between items-center w-full">
            <div class="glass-panel px-5 py-3 rounded-2xl shadow-xl pointer-events-auto flex items-center space-x-3">
                <div class="w-3 h-3 bg-indigo-500 rounded-full animate-ping"></div>
                <h1 class="text-lg font-bold tracking-tight text-slate-800 dark:text-white">Loft Bedroom Walkthrough</h1>
            </div>
            <div class="glass-panel px-4 py-2 rounded-xl shadow-lg pointer-events-auto text-sm font-medium text-slate-700 dark:text-slate-300">
                <i class="fa-solid fa-moon mr-2 text-indigo-400"></i>Sloping Ceiling & Skylight Design
            </div>
        </div>

        <!-- Center Crosshair for Pointer Lock -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div id="crosshair" class="w-2 h-2 rounded-full bg-white/60 border border-black/40 transition-transform duration-200"></div>
        </div>

        <!-- Bottom Instructions Panel -->
        <div class="self-center glass-panel px-6 py-4 rounded-2xl shadow-2xl pointer-events-auto flex flex-col sm:flex-row items-center gap-4 text-xs sm:text-sm text-slate-700 dark:text-slate-300">
            <div class="flex items-center space-x-2">
                <span class="px-2 py-1 bg-indigo-600 text-white rounded font-bold shadow">W A S D</span>
                <span>or</span>
                <span class="px-2 py-1 bg-indigo-600 text-white rounded font-bold shadow">Arrows</span>
                <span class="font-medium">to Move</span>
            </div>
            <div class="hidden sm:block h-4 w-px bg-slate-300 dark:bg-slate-700"></div>
            <div class="flex items-center space-x-2">
                <span class="px-2 py-1 bg-slate-700 text-white rounded font-bold shadow">Click Screen</span>
                <span class="font-medium">to Look Around</span>
            </div>
            <div class="hidden sm:block h-4 w-px bg-slate-300 dark:bg-slate-700"></div>
            <button id="toggle-lights" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-semibold shadow transition-all transform active:scale-95 flex items-center space-x-1.5">
                <i class="fa-solid fa-lightbulb"></i>
                <span>Toggle Warm Lights</span>
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let camera, scene, renderer, controls;
        let roomGroup, warmLights = [];
        let lightsOn = true;

        const moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false
        };

        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let prevTime = performance.now();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b101b);
            scene.fog = new THREE.FogExp2(0x0b101b, 0.025);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, 4);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);

            document.body.addEventListener('click', () => {
                if (!controls.isLocked) {
                    controls.lock();
                }
            });

            controls.addEventListener('lock', () => {
                document.getElementById('crosshair').style.transform = 'scale(1.3)';
            });

            controls.addEventListener('unlock', () => {
                document.getElementById('crosshair').style.transform = 'scale(1)';
            });

            scene.add(controls.getObject());

            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveState.forward = true; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveState.left = true; break;
                    case 'ArrowDown':
                    case 'KeyS': moveState.backward = true; break;
                    case 'ArrowRight':
                    case 'KeyD': moveState.right = true; break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveState.forward = false; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveState.left = false; break;
                    case 'ArrowDown':
                    case 'KeyS': moveState.backward = false; break;
                    case 'ArrowRight':
                    case 'KeyD': moveState.right = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            setupLighting();

            buildArchitecture();

            buildFurniture();

            document.getElementById('toggle-lights').addEventListener('click', (e) => {
                e.stopPropagation();
                lightsOn = !lightsOn;
                warmLights.forEach(light => light.intensity = lightsOn ? 1.5 : 0.0);
            });

            window.addEventListener('resize', onWindowResize);
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0x1e293b, 0.8);
            scene.add(ambientLight);

            const moonLight = new THREE.DirectionalLight(0x38bdf8, 0.4);
            moonLight.position.set(10, 20, 10);
            moonLight.castShadow = true;
            moonLight.shadow.mapSize.width = 2048;
            moonLight.shadow.mapSize.height = 2048;
            moonLight.shadow.bias = -0.0001;
            scene.add(moonLight);
        }

        function buildArchitecture() {
            roomGroup = new THREE.Group();

            // Materials
            const woodFloorMat = new THREE.MeshStandardMaterial({ color: 0x85583b, roughness: 0.4, metalness: 0.1 });
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.8 });
            const darkWallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
            const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, roughness: 0.1, transmission: 0.9, thickness: 0.5 });
            const metalFrameMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2, metalness: 0.8 });

            // Floor (Room is 8 units wide, 10 units deep)
            const floorGeo = new THREE.PlaneGeometry(8, 10);
            const floor = new THREE.Mesh(floorGeo, woodFloorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            roomGroup.add(floor);

            // Back Wall (Tall side: height 5)
            const backWallGeo = new THREE.PlaneGeometry(8, 5);
            const backWall = new THREE.Mesh(backWallGeo, darkWallMat);
            backWall.position.set(0, 2.5, -5);
            backWall.receiveShadow = true;
            roomGroup.add(backWall);

            // Front Wall (Low side: height 2.5)
            const frontWallGeo = new THREE.PlaneGeometry(8, 2.5);
            const frontWall = new THREE.Mesh(frontWallGeo, wallMat);
            frontWall.position.set(0, 1.25, 5);
            frontWall.rotation.y = Math.PI;
            frontWall.receiveShadow = true;
            roomGroup.add(frontWall);

            // Left Wall (Sloping top edge from height 5 down to 2.5)
            const leftWallShape = new THREE.Shape();
            leftWallShape.moveTo(-5, 0);       // Bottom-back
            leftWallShape.lineTo(5, 0);        // Bottom-front
            leftWallShape.lineTo(5, 2.5);      // Top-front (low)
            leftWallShape.lineTo(-5, 5);       // Top-back (high)
            leftWallShape.closePath();

            const leftWallGeo = new THREE.ShapeGeometry(leftWallShape);
            const leftWall = new THREE.Mesh(leftWallGeo, wallMat);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.position.set(-4, 0, 0);
            leftWall.receiveShadow = true;
            roomGroup.add(leftWall);

            // Right Wall (Mirror of Left Wall)
            const rightWall = new THREE.Mesh(leftWallGeo, wallMat);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.position.set(4, 0, 0);
            rightWall.receiveShadow = true;
            roomGroup.add(rightWall);

            // Sloping Ceiling
            // Calculate length and angle of slope
            const slopeLength = Math.sqrt(Math.pow(10, 2) + Math.pow(2.5, 2));
            const slopeAngle = Math.atan2(2.5, 10);

            const ceilingGeo = new THREE.PlaneGeometry(8, slopeLength);
            const ceiling = new THREE.Mesh(ceilingGeo, wallMat);
            ceiling.position.set(0, 3.75, 0);
            ceiling.rotation.x = Math.PI / 2 + slopeAngle;
            ceiling.receiveShadow = true;
            roomGroup.add(ceiling);

            // Skylight on Sloping Ceiling
            const skylightFrameGeo = new THREE.BoxGeometry(2.2, 3.2, 0.2);
            const skylightFrame = new THREE.Mesh(skylightFrameGeo, metalFrameMat);
            skylightFrame.position.set(0, 4.3, 0);
            skylightFrame.rotation.x = Math.PI / 2 + slopeAngle;
            roomGroup.add(skylightFrame);

            const skylightGlassGeo = new THREE.PlaneGeometry(2, 3);
            const skylightGlass = new THREE.Mesh(skylightGlassGeo, glassMat);
            skylightGlass.position.set(0, 4.32, 0);
            skylightGlass.rotation.x = Math.PI / 2 + slopeAngle;
            roomGroup.add(skylightGlass);

            // Warm Skylight shaft illumination
            const skylightLight = new THREE.PointLight(0xffedd5, 1.5, 10);
            skylightLight.position.set(0, 4.0, 0);
            skylightLight.castShadow = true;
            roomGroup.add(skylightLight);
            warmLights.push(skylightLight);

            scene.add(roomGroup);
        }

        function buildFurniture() {
            const furnitureGroup = new THREE.Group();

            // Materials
            const woodFrameMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.5 });
            const fabricMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.9 });
            const pillowMat = new THREE.MeshStandardMaterial({ color: 0x6366f1, roughness: 0.8 });
            const blanketMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
            const nightstandMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.4 });
            const lampMat = new THREE.MeshStandardMaterial({ color: 0xfde047, emissive: 0xfde047, emissiveIntensity: 0.8 });

            // Bed Frame (Placed neatly against the tall back wall under the slope)
            const bedBaseGeo = new THREE.BoxGeometry(2.2, 0.4, 2.0);
            const bedBase = new THREE.Mesh(bedBaseGeo, woodFrameMat);
            bedBase.position.set(0, 0.2, -3.8);
            bedBase.castShadow = true;
            bedBase.receiveShadow = true;
            furnitureGroup.add(bedBase);

            // Mattress
            const mattressGeo = new THREE.BoxGeometry(2.1, 0.35, 1.9);
            const mattress = new THREE.Mesh(mattressGeo, fabricMat);
            mattress.position.set(0, 0.575, -3.8);
            mattress.castShadow = true;
            mattress.receiveShadow = true;
            furnitureGroup.add(mattress);

            // Blanket
            const blanketGeo = new THREE.BoxGeometry(2.1, 0.37, 1.2);
            const blanket = new THREE.Mesh(blanketGeo, blanketMat);
            blanket.position.set(0, 0.59, -3.55);
            blanket.castShadow = true;
            furnitureGroup.add(blanket);

            // Pillows
            const pillowGeo = new THREE.BoxGeometry(0.8, 0.15, 0.5);
            const pillow1 = new THREE.Mesh(pillowGeo, pillowMat);
            pillow1.position.set(-0.55, 0.8, -4.5);
            pillow1.rotation.x = 0.2;
            pillow1.castShadow = true;
            furnitureGroup.add(pillow1);

            const pillow2 = new THREE.Mesh(pillowGeo, pillowMat);
            pillow2.position.set(0.55, 0.8, -4.5);
            pillow2.rotation.x = 0.2;
            pillow2.castShadow = true;
            furnitureGroup.add(pillow2);

            // Nightstands
            const nsGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            
            const nsLeft = new THREE.Mesh(nsGeo, nightstandMat);
            nsLeft.position.set(-1.5, 0.3, -4.6);
            nsLeft.castShadow = true;
            furnitureGroup.add(nsLeft);

            const nsRight = new THREE.Mesh(nsGeo, nightstandMat);
            nsRight.position.set(1.5, 0.3, -4.6);
            nsRight.castShadow = true;
            furnitureGroup.add(nsRight);

            // Bedside Lamps
            const lampGeo = new THREE.SphereGeometry(0.12, 16, 16);
            
            const lampLeft = new THREE.Mesh(lampGeo, lampMat);
            lampLeft.position.set(-1.5, 0.75, -4.6);
            furnitureGroup.add(lampLeft);

            const lightLeft = new THREE.PointLight(0xfde047, 1.0, 4);
            lightLeft.position.set(-1.5, 0.75, -4.6);
            furnitureGroup.add(lightLeft);
            warmLights.push(lightLeft);

            const lampRight = new THREE.Mesh(lampGeo, lampMat);
            lampRight.position.set(1.5, 0.75, -4.6);
            furnitureGroup.add(lampRight);

            const lightRight = new THREE.PointLight(0xfde047, 1.0, 4);
            lightRight.position.set(1.5, 0.75, -4.6);
            furnitureGroup.add(lightRight);
            warmLights.push(lightRight);

            // Minimalist Rug under Bed
            const rugGeo = new THREE.PlaneGeometry(3.5, 4.0);
            const rugMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 });
            const rug = new THREE.Mesh(rugGeo, rugMat);
            rug.rotation.x = -Math.PI / 2;
            rug.position.set(0, 0.01, -3.2);
            rug.receiveShadow = true;
            furnitureGroup.add(rug);

            scene.add(furnitureGroup);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();

            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveState.forward) - Number(moveState.backward);
                direction.x = Number(moveState.right) - Number(moveState.left);
                direction.normalize();

                if (moveState.forward || moveState.backward) velocity.z -= direction.z * 15.0 * delta;
                if (moveState.left || moveState.right) velocity.x -= direction.x * 15.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // Boundary clamping to keep user inside the room
                const pos = controls.getObject().position;
                pos.x = Math.max(-3.5, Math.min(3.5, pos.x));
                pos.z = Math.max(-4.5, Math.min(4.5, pos.z));
                pos.y = 1.7; // Fixed eye level height
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
